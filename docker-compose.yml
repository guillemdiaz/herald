services:
  app:
    build:
      context: .
      target: production
    container_name: herald-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-herald}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres  
      - redis

  postgres:
    image: postgres:18-alpine
    container_name: herald-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: herald
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: herald-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: