services:
  postgres:
    image: postgres:18-alpine
    container_name: herald-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: herald
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    container_name: herald-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: